name: Bug Report
description: Report a problem with the modpack
labels: ["bug"]
body:
  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft Version
      options:
        - "1.20.1"
        - "1.21.1"
        - "1.21.4"
        - "1.21.11"
        - "26.1.2"
    validations:
      required: true
  - type: input
    id: fabric-loader
    attributes:
      label: Fabric Loader Version
      placeholder: "e.g. 0.19.2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the game
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash log or relevant output (if any)
      render: text
